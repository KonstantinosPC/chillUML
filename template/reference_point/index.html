<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <div class="logo">
                <img src="../assets/img/logo.png" alt="">
            </div>
            <h1 class="page-title">Dashboard</h1>
        </div>
        
        <div class="nav-right">
            <div class="user-dropdown-container">
                <button class="user-avatar">
                    <img src="https://ui-avatars.com/api/?name=NG&background=4f46e5&color=fff" alt="User Profile">
                </button>
                <div class="dropdown-menu">
                    <div class="dropdown-header">Ο λογαριασμός μου</div>
                    <a href="#" class="dropdown-item">Προφίλ</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item text-danger">Αποσύνδεση</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="content-card">
            
            <div class="card-toolbar">
                <button class="btn btn-delete" >Delete</button>
                <button class="btn btn-outline">Edit</button>
                <button class="btn btn-primary">Create</button>
            </div>

            <div class="projects-list">
                
                <label class="project-item">
                    <input type="checkbox" class="custom-checkbox" checked>
                    <span class="project-name">Project A</span>
                </label>
                
                <label class="project-item">
                    <input type="checkbox" class="custom-checkbox">
                    <span class="project-name">Project B</span>
                </label>

                <div class="shared-divider">
                    <span class="divider-text">Shared Projects</span>
                </div>

                <label class="project-item">
                    <input type="checkbox" class="custom-checkbox">
                    <span class="project-name">Project C</span>
                </label>

            </div>
        </div>
    </main>

</body>
</html>
