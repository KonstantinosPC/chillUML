<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - chillUML</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        :root {
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --sidebar-bg: #475569;
            --sidebar-hover: #334155;
            --bg-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .settings-card {
            display: flex;
            width: 1000px;
            max-width: 95%;
            background-color: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--white);
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .nav-item {
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: var(--sidebar-hover);
            color: var(--white);
        }

        .nav-item.active {
            background-color: var(--sidebar-hover);
            color: var(--primary);
            border-left: 4px solid var(--primary);
        }

        .nav-item .material-symbols-outlined {
            font-size: 20px;
        }

        /* --- Main Content Styles --- */
        .content {
            flex: 1;
            padding: 40px 50px;
            background-color: var(--white);
        }

        .header h2 {
            margin: 0 0 5px 0;
            font-size: 28px;
            color: var(--text-main);
        }

        .header p {
            margin: 0 0 30px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* --- Avatar & User Info --- */
        .profile-top {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .avatar-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            overflow: hidden;
            cursor: pointer;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .avatar-container:hover .avatar-overlay {
            opacity: 1;
        }

        .avatar-actions {
            display: flex;
            gap: 10px;
        }

        .info-column {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- Form Elements --- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-main);
            transition: border-color 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .form-group input:disabled {
            background-color: #f1f5f9;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .form-help {
            font-size: 12px;
            color: var(--text-muted);
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 30px 0;
        }

        /* --- Password Section --- */
        .password-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* --- Buttons --- */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .actions-row {
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>

    <div class="settings-card">
        
        <aside class="sidebar">
            <a href="#" class="nav-item active">
                <span class="material-symbols-outlined">person</span>
                Profile Details
            </a>
            <a href="#" class="nav-item">
                <span class="material-symbols-outlined">shield_lock</span>
                Security & Password
            </a>
            <a href="#" class="nav-item">
                <span class="material-symbols-outlined">tune</span>
                Preferences
            </a>
            <a href="#" class="nav-item">
                <span class="material-symbols-outlined">database</span>
                Account Data
            </a>
        </aside>

        <main class="content">
            <div class="header">
                <h2>Profile Settings</h2>
                <p>Customize your presence on the iceberg</p>
            </div>

            <form action="#" method="POST">
                
                <div class="section-title">Avatar & Name</div>
                
                <div class="profile-top">
                    <div class="avatar-column">
                        <div class="avatar-container">
                            <img src="https://i.imgur.com/KOTvY54.jpeg" alt="Penguin Avatar">
                            <div class="avatar-overlay">
                                <span class="material-symbols-outlined">photo_camera</span>
                                <span>Change Picture</span>
                            </div>
                        </div>
                        <div class="avatar-actions">
                            <button type="button" class="btn btn-primary btn-sm">Update</button>
                            <button type="button" class="btn btn-secondary btn-sm">Remove</button>
                        </div>
                    </div>

                    <div class="info-column">
                        <div class="form-group">
                            <label>Display Name</label>
                            <input type="text" name="displayName" value="Konstantinos P.">
                        </div>
                        
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" value="k.eliopoulos" disabled>
                            <span class="form-help">Username cannot be changed. Contact support if needed.</span>
                        </div>

                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" name="email" value="k.eliopoulos@chilluml.com">
                        </div>
                    </div>
                </div>

                <hr>

                <div class="section-title">Change Password</div>
                
                <div class="password-grid">
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" name="oldPassword" placeholder="Enter old password">
                    </div>
                    
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" name="newPassword" placeholder="Minimum 8 characters">
                    </div>
                    
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" name="confirmPassword" placeholder="Repeat new password">
                    </div>
                </div>

                <div class="actions-row">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" class="btn btn-secondary">Cancel</button>
                </div>

            </form>
        </main>
    </div>

</body>
</html>
