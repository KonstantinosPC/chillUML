<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" th:href="@{/assets/image/logo.png}" type="image/x-icon">
    <title>Ουπς! Κάτι πήγε στραβά - chillUML</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .error-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .error-container img{
            max-width: 50%;
            max-height: 200px;
        }

        .error-code {
            font-size: 80px;
            font-weight: 800;
            color: #ef4444;
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 24px;
            font-weight: 600;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .error-message {
            color: #4b5563;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .error-details {
            background-color: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            color: #6b7280;
            word-wrap: break-word;
            margin-bottom: 25px;
            text-align: left;
            border: 1px solid #e5e7eb;
        }
        .btn {
            display: inline-block;
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

<div class="error-container">
    <img src="./assets/img/logo.png" alt="">
    <h1 class="error-code" th:text="${status ?: 'Error'}">404</h1>
    <h2 class="error-title" th:text="${error ?: 'Άγνωστο Σφάλμα'}">Not Found</h2>

    <p class="error-message">Ουπς! Φαίνεται πως τα πράγματα δεν πήγαν τόσο "chill".</p>


    <a th:href="@{/dashboard}" class="btn">Επιστροφή στο Dashboard</a>
</div>

</body>
</html>
