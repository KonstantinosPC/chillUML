<html>
    <head>
        <title>Dashboard | ChillUML</title>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    </head>
    <style>
        main{
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <body>

        <nav>
            <div class="nav-left">
                <div class="logo">
                    <img src="../assets/img/logo.png" alt="">
                </div>
                <h1 class="page-title">Dashboard</h1>
            </div>
            
            <div class="nav-right">
                <div class="user-dropdown-container">
                    <button class="user-avatar">
                        <img src="https://ui-avatars.com/api/?name=NG&background=4f46e5&color=fff" alt="User Profile">
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-header">Ο λογαριασμός μου</div>
                        <a href="#" class="dropdown-item">Προφίλ</a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item text-danger">Αποσύνδεση</a>
                    </div>
                </div>
            </div>
        </nav>

        <div id="pop-up" class="pop-up">
            <form id="create-project" class="create-project">
                <h1>Create Project</h1>
                <input type="text" placeholder="Project Name">
                <textarea name="" id="" placeholder="Project Description"></textarea>
                <button type="submit">Create Project</button>
                <button onclick="togglePopUp('create-project')" class="close" type="button">Close</button>
            </form>
            <form id="edit-project" class="edit-project">
                <h1>Edit Project</h1>
                <h3>Project A</h3>
                <input type="text" placeholder="Project Name">
                <textarea name="" id="" placeholder="Project Description"></textarea>
                <button type="submit">Submit Changes</button>
                <button onclick="togglePopUp('edit-project')" class="close" type="button">Close</button>
            </form>
        </div>

        

        <main>
            <div class="projects">
                <div class="toolbar">
                    <input type="text" id="search-project" placeholder="Search Project">
                    <button class="delete" disabled>Delete</button>
                    <button onclick="togglePopUp('edit-project')">Edit</button>
                    <button onclick="togglePopUp('create-project')" class="create">Create</button>
                </div>
                <div class="project-list">
                    <div class="project">
                        <input type="checkbox">
                        <span class="project-name">Project A</span>
                        <span class="project-owner">KonstantinosPC</span>
                        <span class="project-edition">10 Dec 2025</span>
                    </div>
                    <div class="project">
                        <input type="checkbox">
                        <span class="project-name">Project B</span>
                        <span class="project-owner">KonstantinosPC</span>
                        <span class="project-edition">25 Dec 2025</span>
                    </div>
                    <div class="project">
                        <input type="checkbox">
                        <span class="project-name">Project C</span>
                        <span class="project-owner">KonstantinosPC</span>
                        <span class="project-edition">1 Jan 2026</span>
                    </div>
                    
                </div>

                <h1 class="shared-project">
                    Shared Projects
                </h1>

                <div class="project-list">
                    <div class="project">
                        <input type="checkbox">
                        <span class="project-name">Project D</span>
                        <span class="project-owner">Tasos</span>
                        <span class="project-edition">30 Jan 2026</span>
                    </div>
                    <div class="project">
                        <input type="checkbox">
                        <span class="project-name">Project E</span>
                        <span class="project-owner">Anagno</span>
                        <span class="project-edition">2 Jan 2026</span>
                    </div>
                </div>
            </div>


            <div class="notifications">
            </div>
        </main>

        <script>
            const searchBar = document.getElementById("search-project");
            const projects = document.querySelectorAll(".project");

            searchBar.addEventListener('input', () => {
                const filter = searchBar.value.toLowerCase();

                projects.forEach(project => {
                    const projectName = project.querySelector(".project-name").textContent.toLowerCase();

                    if(projectName.includes(filter)){
                        project.style.display = "flex";
                    }else{
                        project.style.display = "none";
                    }

                });
            });

            function togglePopUp(type){
                const popUp = document.getElementById("pop-up");
                const windowed = document.getElementById(type);

                if(popUp.style.height == "100%"){
                    popUp.style.height = 0;
                    setTimeout(windowed.style.display = 'none', 5000);
                }else{
                    popUp.style.height = '100%';
                    windowed.style.display = 'initial';
                }
                
            }
        </script>
    </body>
</html>
