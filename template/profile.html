<html>
    <head>
        <title>Test | ChillUML</title>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    </head>
    <style>
        main{
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgb(233, 233, 233);
        }
    </style>
    <body>

        <nav>
            <div class="nav-left">
                <div class="logo">
                    <img src="../assets/img/logo.png" alt="">
                </div>
                <h1 class="page-title">Dashboard</h1>
            </div>
            
            <div class="nav-right">
                <div class="user-dropdown-container">
                    <button class="user-avatar">
                        <img src="https://ui-avatars.com/api/?name=NG&background=4f46e5&color=fff" alt="User Profile">
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-header">Ο λογαριασμός μου</div>
                        <a href="#" class="dropdown-item">Προφίλ</a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item text-danger">Αποσύνδεση</a>
                    </div>
                </div>
            </div>
        </nav>

        <main>

            <div class="profile-settings">
                <center><h1>Profile Settings</h1></center>
                <hr>
                <form action="" class="profile-picture">
                    <h3>Change Profile Picture</h3>
                    <div class="current">
                        <img src="./assets/img/profile-1.png" alt="">
                        <span>Current Profile Picture</span>
                    </div>

                </form>
                <hr>
                <form action="" class="profile-username">
                    <h3>Change Username</h3>
                    <input type="text" id="username" placeholder="Username" required>
                    <button>Change Username</button>
                </form>
                <hr>
                <form action="" class="profile-password">
                    <h3>Change Password</h3>
                    <input type="text" id="old-password" placeholder="Old Password" required>
                    <input type="text" id="new-password" placeholder="New Password" required>
                    <input type="text" id="conf-password" placeholder="Confirm Password" required>
                    <button>Change Password</button>
                </form>
                <hr>
                <form action="" class="profile-email">
                    <h3>Change Email</h3>
                    <input type="email" name="" id="email" placeholder="Email" required>
                    <button>Change Email</button>
                </form>
            </div>

        </main>
        <div class="notifications">    
        </div>
    </body>
</html>
