<html>
    <head>
        <title>Test | ChillUML</title>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    </head>
    <style>
        main{
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgb(233, 233, 233);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
    </style>
    <body>

        <nav>
            <div class="nav-left">
                <div class="logo">
                    <img src="../assets/img/logo.png" alt="">
                </div>
                <h1 class="page-title">Dashboard</h1>
            </div>
            
            <div class="nav-right">
                <div class="user-dropdown-container">
                    <button class="user-avatar">
                        <img src="https://ui-avatars.com/api/?name=NG&background=4f46e5&color=fff" alt="User Profile">
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-header">Ο λογαριασμός μου</div>
                        <a href="#" class="dropdown-item">Προφίλ</a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item text-danger">Αποσύνδεση</a>
                    </div>
                </div>
            </div>
        </nav>

        <main>

            <div class="settings-card">
                <div class="header">
                    <h2>Profile Settings</h2>
                </div>

                <div class="avatar-section">
                    <span class="label">Choose Avatar</span>
                    <div class="stock-grid">
                        <img src="./assets/img/panda-coffee.png" class="stock-img selected" onclick="selectAvatar(this, 'Panda')">
                        <img src="./assets/img/profile-1.png" class="stock-img" onclick="selectAvatar(this, 'Penguin')">
                    </div>
                </div>

                <div class="setting-row">
                    <div class="row-top">
                        <span class="label">User ID</span>
                        <span class="id-badge">#882931</span>
                    </div>
                </div>

                <div class="setting-row" id="row-username">
                    <div class="row-top">
                        <div>
                            <div class="label">Username</div>
                            <div class="value-display" id="val-username">Alex_Dev</div>
                        </div>
                        <span class="edit-trigger" onclick="toggleEdit('username')">✎</span>
                    </div>
                    <form class="edit-form" onsubmit="saveField(event, 'username')">
                        <input type="text" id="input-username" value="Alex_Dev" required>
                        <button type="submit" class="btn btn-save">Save</button>
                    </form>
                </div>

                <div class="setting-row" id="row-email">
                    <div class="row-top">
                        <div>
                            <div class="label">Email Address</div>
                            <div class="value-display" id="val-email">alex@example.com</div>
                        </div>
                        <span class="edit-trigger" onclick="toggleEdit('email')">✎</span>
                    </div>
                    <form class="edit-form" onsubmit="saveField(event, 'email')">
                        <input type="email" id="input-email" value="alex@example.com" required>
                        <button type="submit" class="btn btn-save">Save</button>
                    </form>
                </div>

                <div class="setting-row">
                    <span class="label">Change Password</span>
                    <form onsubmit="saveField(event, 'password')">
                        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
                            <input type="password" id="old-pass" placeholder="Old Password" required>
                            <input type="password" id="pass-new" placeholder="New Password" required>
                            <input type="password" id="pass-confirm" placeholder="Confirm Password" required>
                        </div>
                        <button type="submit" class="btn btn-pass">Update Password</button>
                    </form>
                </div>
            </div>

        </main>
        <div class="notifications">   
        </div>
    </body>

    <script>
        // Συνάρτηση για να εμφανίζει/κρύβει το input field
        function toggleEdit(field) {
            const row = document.getElementById(`row-${field}`);
            const form = row.querySelector('.edit-form');
            const display = row.querySelector('.value-display');
            
            form.classList.toggle('active');
            // Αν το form έγινε active, κρύβουμε το απλό κείμενο
            display.style.display = form.classList.contains('active') ? 'none' : 'block';
        }
        // Επιλογή Avatar
        function selectAvatar(element, seed) {
            // Αφαίρεση του 'selected' από όλα
            document.querySelectorAll('.stock-img').forEach(img => img.classList.remove('selected'));
            // Προσθήκη στο επιλεγμένο
            element.classList.add('selected');
            
            // Αποστολή στο backend
            console.log("Στέλνω στο Backend το νέο avatar seed:", seed);
        }
    </script>
</html>
