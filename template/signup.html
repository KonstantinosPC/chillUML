<html>
    <head>
        <title>Sign Up | ChillUML</title>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    </head>
    <body>

        <style>
            main{
                display: flex;
                align-items: center;
                justify-content: center;
            }
        </style>

        <main>
            <form class="login">
                <h1>Sign Up</h1>
                <input type="text" placeholder="Username" required>
                <input type="email" placeholder="Email" required>
                <input type="password" name="password" id="password" placeholder="Password" required>
                
                <div class="strength-container">
                    <div id="strength-bar"></div>
                </div>

                <ul class="checklist">
                    <li id="char-length">Τουλάχιστον 8 χαρακτήρες</li>
                    <li id="has-number">Τουλάχιστον έναν αριθμό</li>
                    <li id="has-special">Έναν ειδικό χαρακτήρα (!@#$%^&*)</li>
                </ul>
                <input type="password" name="conf-password" id="conf-password" placeholder="Confirm Password">
                <div class="tos">
                    <input type="checkbox" name="" id="terms" style="width: initial;">
                    <label for="terms" >Agree to the <a href="">Terms and Conditions</a></label>
                </div>
                <button id="submit">Submit</button>
                <p>Already have an account? <a href="./login.html">Sign In</a></p>
            </form>

            <div class="notifications">
            </div>
        </main>


        <script>
            
            const passwordInput = document.getElementById('password');
            const confPassword = document.getElementById('conf-password');
            const strengthBar = document.getElementById('strength-bar');
            const charLength = document.getElementById('char-length');
            const hasNumber = document.getElementById('has-number');
            const hasSpecial = document.getElementById('has-special');

            passwordInput.addEventListener('input', () => {
                const val = passwordInput.value;
                let strength = 0;

                if (val.length >= 8) {
                    charLength.classList.add('valid');
                    strength += 1;
                } else {
                    charLength.classList.remove('valid');
                }


                if (/\d/.test(val)) {
                    hasNumber.classList.add('valid');
                    strength += 1;
                } else {
                    hasNumber.classList.remove('valid');
                }

                if (/[!@#$%^&*(),.?":{}|<>]/.test(val)) {
                    hasSpecial.classList.add('valid');
                    strength += 1;
                } else {
                    hasSpecial.classList.remove('valid');
                }

                const percentage = (strength / 3) * 100;
                strengthBar.style.width = percentage + '%';

                if (strength === 1) strengthBar.style.backgroundColor = "#ff4d4d"; // Κόκκινο
                else if (strength === 2) strengthBar.style.backgroundColor = "#ffa500"; // Πορτοκαλί
                else if (strength === 3) strengthBar.style.backgroundColor = "#2ecc71"; // Πράσινο
                else strengthBar.style.backgroundColor = "#ddd";

                if (percentage === 100){
                    passwordInput.style.border = "solid 0.1px green";
                }else{
                    passwordInput.style.border = "none";
                }
            });
            confPassword.addEventListener('input', () => {
                const val = confPassword.value;
                if (val === passwordInput.value){
                    confPassword.style.border = "solid 0.1px green";
                }else{
                    confPassword.style.border = "solid 0.1px red";
                }
            });
        </script>
    </body>
</html>
