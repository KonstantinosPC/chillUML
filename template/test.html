<html>
    <head>
        <title>Test | ChillUML</title>
        <link rel="stylesheet" href="./style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    </head>
    <body>


        <main>
            <div class="notifications info">
                <div class="notification">
                    <span class="material-symbols-outlined">info</span>
                    <p>Your new password is the same as your old password</p>
                </div>

                <div class="notification error">
                    <span class="material-symbols-outlined">close</span>
                    <p>This user already exists</p>
                </div>

                <div class="notification check">
                    <span class="material-symbols-outlined">check</span>
                    <p>Saved Project</p>
                </div>

                <div class="notification critical">
                    <span class="material-symbols-outlined">dangerous</span>
                    <p><b>Critical</b><br>Your password has been leaked</p>
                </div>
            </div>
        </main>
    </body>
</html>
