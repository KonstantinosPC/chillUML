# H2 in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Make Hibernate generate SQL closer to MySQL
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# Ensure data.sql runs
spring.sql.init.mode=always

# Debugging (optional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View
spring.jpa.open-in-view=false

# H2 Console (optional but VERY useful)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console