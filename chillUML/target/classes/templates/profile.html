<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Test | ChillUML</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    </head>
    <style>
        main{
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgb(233, 233, 233);
        }
    </style>
    <body>

        <nav>
            <div class="nav-left">
                <div class="logo">
                    <img th:src="@{/assets/image/logo.png}" alt="">
                </div>
                <h1 class="page-title">Dashboard</h1>
            </div>
            
            <div class="nav-right">
                <div class="user-dropdown-container">
                    <button class="user-avatar">
                        <img th:src="@{/assets/image/freddo.png}" alt="User Profile">
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-header">Ο λογαριασμός μου</div>
                        <a th:href="@{/profile}" class="dropdown-item">Προφίλ</a>
                        <div class="dropdown-divider"></div>
                        <a th:href="@{/auth/logout}" class="dropdown-item text-danger">Αποσύνδεση</a>
                    </div>
                </div>
            </div>
        </nav>

        <main>

            <div class="profile-settings">
                <center><h1>Profile Settings</h1></center>
                <hr>
                <form action="" class="profile-picture">
                    <h3>Change Profile Picture</h3>
                    <div class="current">
                        <img th:src="@{/assets/image/freddo.png}" alt="">
                        <span>Current Profile Picture</span>
                    </div>

                </form>
                <hr>
                <form th:action="@{/profile/username}" method="post" class="profile-username">
                    <h3>Change Username</h3>
                    <input type="text" name="username" id="username" placeholder="Username" required>
                    <button>Change Username</button>
                </form>
                <hr>
                <form th:action="@{/profile/password}" method="post" class="profile-password">
                    <h3>Change Password</h3>
                    <input type="password" name="old-password" id="old-password" placeholder="Old Password" required>
                    <input type="password" name="new-password" id="new-password" placeholder="New Password" required>
                    <input type="password" name="conf-password" id="conf-password" placeholder="Confirm Password" required>
                    <button>Change Password</button>
                </form>
                <hr>
                <form th:action="@{/profile/email}" method="post" class="profile-email">
                    <h3>Change Email</h3>
                    <input type="email" name="email" id="email" placeholder="Email: examle@example.com" required>
                    <button>Change Email</button>
                </form>
            </div>

        </main>
        <div class="notifications">
            <div th:if="${error}" class="notification error">
                <span class="material-symbols-outlined">close</span>
                <p th:text="${error}">This user already exists</p>
            </div>
            <div th:if="${success}" class="notification check">
                <span class="material-symbols-outlined">check</span>
                <p th:text="${success}"></p>
            </div>
        </div>
    </body>
</html>
