<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Profile Settings | ChillUML</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    </head>
    <style>
        main{
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgb(233, 233, 233);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
    </style>
    <body>

        <nav>
            <div class="nav-left">
                <div class="logo">
                    <img th:src="@{/assets/image/logo.png}" alt="">
                </div>
                <h1 class="page-title">Dashboard</h1>
            </div>
            
            <div class="nav-right">
                <div class="user-dropdown-container">
                    <button class="user-avatar">
                        <img th:src="@{/assets/image/freddo.png}" alt="User Profile">
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-header">Ο λογαριασμός μου</div>
                        <a th:href="@{/profile}" class="dropdown-item">Προφίλ</a>
                        <div class="dropdown-divider"></div>
                        <a th:href="@{/auth/logout}" class="dropdown-item text-danger">Αποσύνδεση</a>
                    </div>
                </div>
            </div>
        </nav>

        <main>

            <div class="settings-card">
                <div class="header">
                    <h2>Profile Settings</h2>
                </div>

                <div class="avatar-section">
                    <span class="label">Choose Avatar</span>
                    <div class="stock-grid">
                        <img th:src="@{/assets/image/freddo.png}" class="stock-img selected" onclick="selectAvatar(this, 'Freddo')">
                        <img th:src="@{/assets/image/catUML.png}" class="stock-img" onclick="selectAvatar(this, 'Penguin')">
                    </div>
                </div>

                <div class="setting-row">
                    <div class="row-top">
                        <span class="label">User ID</span>
                        <span class="id-badge" th:text="${user.getID()}"></span>
                    </div>
                </div>

                <div class="setting-row" id="row-username">
                    <div class="row-top">
                        <div>
                            <div class="label">Username</div>
                            <div class="value-display" id="val-username"><span th:text="${user.username}">Username</span></div>
                        </div>
                        <span class="edit-trigger" onclick="toggleEdit('username')">✎</span>
                    </div>
                    <form class="edit-form" th:action="@{/profile/username}" method="POST">
                        <input type="text" name="username" id="username" th:value="${user.username}" required>
                        <button type="submit" class="btn btn-save">Save</button>
                    </form>
                </div>

                <div class="setting-row" id="row-email">
                    <div class="row-top">
                        <div>
                            <div class="label">Email Address</div>
                            <div class="value-display" id="val-email"><span th:text="${user.email}">Email</span></div>
                        </div>
                        <span class="edit-trigger" onclick="toggleEdit('email')">✎</span>
                    </div>
                    <form class="edit-form" th:action="@{/profile/email}" method="POST">
                        <input type="email" name="email" id="email" th:value="${user.email}" required>
                        <button type="submit" class="btn btn-save">Save</button>
                    </form>
                </div>

                <div class="setting-row">
                    <span class="label">Change Password</span>
                    <form th:action="@{/profile/password}" method="post">
                        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
                            <input type="password" name="old-password" id="old-password" placeholder="Old Password" required>
                            <input type="password" name="new-password" id="new-password" placeholder="New Password" required>
                            <input type="password" name="conf-password" id="conf-password" placeholder="Confirm Password" required>
                        </div>
                        <button type="submit" class="btn btn-pass">Update Password</button>
                    </form>
                </div>
            </div>

        </main>
        <div class="notifications">
            <div th:if="${error}" class="notification error">
                <span class="material-symbols-outlined">close</span>
                <p th:text="${error}">This user already exists</p>
            </div>
            <div th:if="${success}" class="notification check">
                <span class="material-symbols-outlined">check</span>
                <p th:text="${success}"></p>
            </div>
        </div>
    </body>
    <script>
        // Συνάρτηση για να εμφανίζει/κρύβει το input field
        function toggleEdit(field) {
            const row = document.getElementById(`row-${field}`);
            const form = row.querySelector('.edit-form');
            const display = row.querySelector('.value-display');

            form.classList.toggle('active');
            // Αν το form έγινε active, κρύβουμε το απλό κείμενο
            display.style.display = form.classList.contains('active') ? 'none' : 'block';
        }
        // Επιλογή Avatar
        function selectAvatar(element, seed) {
            // Αφαίρεση του 'selected' από όλα
            document.querySelectorAll('.stock-img').forEach(img => img.classList.remove('selected'));
            // Προσθήκη στο επιλεγμένο
            element.classList.add('selected');

            // Αποστολή στο backend
            console.log("Στέλνω στο Backend το νέο avatar seed:", seed);
        }
    </script>
</html>
