<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Dashboard | ChillUML</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    </head>
    <style>
        main{
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
    <body>

        <nav>
            <div class="nav-left">
                <div onclick="window.location.href='/dashboard'" class="logo">
                    <img th:src="@{/assets/image/logo.png}" alt="">
                </div>
                <h1 class="page-title">Dashboard</h1>
            </div>
            
            <div class="nav-right">
                <div class="user-dropdown-container">
                    <button class="user-avatar">
                        <img th:src="@{'/assets/avatars/' + ${user.getProfilePicture()} + '.png'}" alt="User Profile">
                    </button>
                    <div class="dropdown-menu">
                        <div class="dropdown-header">Hello <span th:text="${user.username}"></span></div>
                        <a th:href="@{/profile}" class="dropdown-item">Profile Settings</a>
                        <div class="dropdown-divider"></div>
                        <a th:href="@{/auth/logout}" class="dropdown-item text-danger">Log Out</a>
                    </div>
                </div>
            </div>
        </nav>

        <div id="pop-up" class="pop-up">
            <form th:action="@{/project/create-project}" method="POST" id="create-project" class="create-project">
                <h1>Create Project</h1>
                <input type="text" name="project-name" id="project-name" placeholder="Project Name">
                <textarea name="project-description" id="project-description" placeholder="Project Description"></textarea>
                <button type="submit">Create Project</button>
                <button onclick="togglePopUp('create-project')" class="close" type="button">Close</button>
            </form>
            <form th:action="@{/project/edit-project}" method="POST" id="edit-project" class="edit-project">
                <h1>Edit Project</h1>
                <h3 id="edit-project-info">Project A</h3>
                <input type="hidden" name="edit-id" id="edit-id">
                <input type="text" name="edit-name" id="edit-name" placeholder="Project Name">
                <textarea name="edit-description" id="edit-description" placeholder="Project Description"></textarea>
                <button type="submit">Submit Changes</button>
                <button onclick="togglePopUp('edit-project')" class="close" type="button">Close</button>
            </form>
        </div>

        <main>
            <div class="projects">
                <div class="toolbar">
                    <input type="text" id="search-project" placeholder="Search Project">
                    <button id="btn-delete" class="delete" disabled onclick="confirmDelete()">Delete</button>
                    <button id="btn-edit" disabled onclick="openEditModal()">Edit</button>
                    <button onclick="togglePopUp('create-project')" class="create">Create</button>
                </div>
                <div class="project-list">
                    <div th:each="project : ${projects}" class="project">
                        <input class="project-checkbox" type="checkbox" th:data-id="${project.getId()}" th:data-name="${project.getProjectName()}" th:data-desc="${project.getProjectDescription()}">
                        <a class="project-name" th:href="@{/project/{id}(id=${project.getProjectName()})}" ><span th:text="${project.getProjectName()}"></span></a>
                        <span class="project-owner" th:text="${project.getOwnerId().getUsername()}" >KonstantinosPC</span>
                        <span class="project-edition">10 Dec 2025</span>
                    </div>
                </div>

                <h1 class="shared-project">
                    Shared Projects
                </h1>

                <div class="project-list">
                    <div class="project">
                        <input type="checkbox">
                        <span class="project-name">Project D</span>
                        <span class="project-owner">Tasos</span>
                        <span class="project-edition">30 Jan 2026</span>
                    </div>
                    <div class="project">
                        <input type="checkbox">
                        <span class="project-name">Project E</span>
                        <span class="project-owner">Anagno</span>
                        <span class="project-edition">2 Jan 2026</span>
                    </div>
                </div>
            </div>


            <div class="notifications">
                <div th:if="${error}" class="notification error">
                    <span class="material-symbols-outlined">close</span>
                    <p th:text="${error}">This user already exists</p>
                </div>
                <div th:if="${success}" class="notification check">
                    <span class="material-symbols-outlined">check</span>
                    <p th:text="${success}"></p>
                </div>
            </div>
        </main>

        <script>
            const searchBar = document.getElementById("search-project");
            const projects = document.querySelectorAll(".project");

            const deleteBtn = document.getElementById('btn-delete');
            const editBtn = document.getElementById('btn-edit');
            const checkboxes = document.querySelectorAll('.project-checkbox');

            checkboxes.forEach(ch => {
                ch.addEventListener('change', () => {
                    const selectedCount = document.querySelectorAll('.project-checkbox:checked').length;

                    deleteBtn.disabled = selectedCount === 0;

                    editBtn.disabled = selectedCount !== 1;
                });
            });

            searchBar.addEventListener('input', () => {
                const filter = searchBar.value.toLowerCase();

                projects.forEach(project => {
                    const projectName = project.querySelector(".project-name").textContent.toLowerCase();

                    if(projectName.includes(filter)){
                        project.style.display = "flex";
                    }else{
                        project.style.display = "none";
                    }

                });
            });

            function togglePopUp(type){
                const popUp = document.getElementById("pop-up");
                const windowed = document.getElementById(type);

                if(popUp.style.height == "100%"){
                    popUp.style.height = 0;
                    setTimeout(windowed.style.display = 'none', 5000);
                }else{
                    popUp.style.height = '100%';
                    windowed.style.display = 'initial';
                }
            }

            // DELETE με επιβεβαίωση
            function confirmDelete() {
                const selected = document.querySelectorAll('.project-checkbox:checked');
                const ids = Array.from(selected).map(ch => ch.dataset.id);

                if (confirm(`Είσαι σίγουρος ότι θέλεις να διαγράψεις ${selected.length} project;`)) {
                    // Εδώ θα κάνεις το post στη βάση (π.χ. μέσω window.location ή fetch)
                    console.log("Διαγραφή των IDs:", ids);
                    // Παράδειγμα: window.location.href = '/project/delete?ids=' + ids.join(',');
                }
            }

            function openEditModal() {
                const selected = document.querySelector('.project-checkbox:checked');
                if (!selected) return;

                const id = selected.dataset.id;
                const name = selected.dataset.name;
                const desc = selected.dataset.desc;

                document.getElementById("edit-project-info").innerText = `${name} | #${id}`;
                document.getElementById("edit-id").value = id;
                document.getElementById("edit-name").value = name;
                document.getElementById("edit-description").value = desc;

                togglePopUp('edit-project');
            }
        </script>
    </body>
</html>
